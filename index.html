<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>商铺选址分析助手</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --border: #e5e7eb;
            --border-light: #f3f4f6;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-soft: #dbeafe;
            --success: #059669;
            --success-light: #ecfdf5;
            --warning: #d97706;
            --warning-light: #fffbeb;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --shadow: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --radius: 12px;
            --radius-sm: 8px;
            --chat-user-bg: #eff6ff;
            --chat-ai-bg: #f9fafb;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif;
            background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;
            overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
        }
        .header{
            background:var(--surface);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;box-shadow:var(--shadow);
        }
        .header-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;}
        .header-actions{display:flex;gap:4px;}
        .btn{
            padding:7px 12px;border-radius:18px;border:none;font-size:12px;font-weight:600;cursor:pointer;
            transition:all 0.15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
            background:transparent;color:var(--text-secondary);
        }
        .btn:active{transform:scale(0.96);}
        .btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,0.3);}
        .btn-outline{border:1.5px solid var(--border);background:var(--surface);}
        .btn-ghost{background:transparent;}
        .btn-sm{padding:5px 10px;font-size:11px;border-radius:14px;}
        .btn-xs{padding:3px 8px;font-size:10px;border-radius:10px;}
        .btn-block{width:100%;justify-content:center;padding:12px;}
        .btn:disabled{opacity:0.5;pointer-events:none;}

        .steps-bar{
            display:flex;align-items:center;justify-content:center;gap:0;padding:8px 10px;
            background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;
        }
        .step-group{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
        .step-dot{
            width:24px;height:24px;border-radius:50%;background:var(--border-light);display:flex;
            align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-muted);
            transition:all 0.3s;
        }
        .step-dot.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,0.4);animation:pulse 1.5s infinite;}
        .step-dot.done{background:var(--success);color:#fff;}
        @keyframes pulse{0%,100%{box-shadow:0 2px 8px rgba(37,99,235,0.3);}50%{box-shadow:0 4px 16px rgba(37,99,235,0.5);}}
        .step-line{flex:1;height:2px;min-width:10px;background:var(--border-light);border-radius:1px;transition:background 0.4s;margin:0 2px;margin-bottom:16px;}
        .step-line.done{background:var(--success);}
        .step-label{font-size:8px;color:var(--text-muted);margin-top:2px;text-align:center;min-width:38px;}
        .step-label.active{color:var(--primary);font-weight:600;}

        .main-content{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
        .main-content::-webkit-scrollbar{width:3px;}
        .main-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

        .card{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--border-light);animation:slideUp 0.3s ease-out;}
        @keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
        .card-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
        .layer-badge{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:600;}
        .badge-layer1{background:#eff6ff;color:#2563eb;}.badge-layer2{background:#ecfdf5;color:#059669;}
        .badge-layer3{background:#fffbeb;color:#d97706;}.badge-layer4{background:#fef2f2;color:#dc2626;}

        .form-group{margin-bottom:10px;}
        .form-label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;}
        .form-sublabel{font-size:10px;color:var(--text-muted);font-weight:400;}
        .form-input,.form-textarea,.form-select{
            width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
            font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;
        }
        .form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
        .form-textarea{min-height:55px;resize:vertical;}
        .form-hint{font-size:10px;color:var(--text-muted);margin-top:2px;}

        .radius-selector{display:flex;gap:4px;flex-wrap:wrap;}
        .radius-opt{
            padding:8px 14px;border:1.5px solid var(--border);border-radius:18px;font-size:12px;
            font-weight:600;cursor:pointer;transition:all 0.15s;background:var(--surface);color:var(--text-secondary);user-select:none;
        }
        .radius-opt.selected{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(37,99,235,0.25);}
        .radius-opt:active{transform:scale(0.95);}

        .poi-table-wrap{max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:4px;border:1px solid var(--border-light);border-radius:var(--radius-sm);}
        .poi-table-wrap::-webkit-scrollbar{width:3px;}
        .poi-table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
        .poi-table{width:100%;border-collapse:collapse;font-size:10px;}
        .poi-table th{background:var(--bg);padding:6px 5px;text-align:left;font-weight:600;color:var(--text-secondary);position:sticky;top:0;z-index:1;border-bottom:2px solid var(--border);}
        .poi-table td{padding:5px;border-bottom:1px solid var(--border-light);}
        .poi-dist{font-weight:600;color:var(--primary);white-space:nowrap;}
        .poi-dist.near{color:var(--danger);}.poi-dist.mid{color:var(--warning);}.poi-dist.far{color:var(--text-muted);}

        .section-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;padding:5px 0;font-size:11px;font-weight:600;color:var(--primary);}
        .section-toggle .arrow{transition:transform 0.25s;font-size:8px;}
        .section-toggle.expanded .arrow{transform:rotate(90deg);}
        .section-content{display:none;}.section-content.show{display:block;}

        .ai-block{border-radius:var(--radius-sm);padding:9px 12px;margin:6px 0;font-size:12px;line-height:1.6;border-left:3px solid var(--primary);background:linear-gradient(135deg,#f0f9ff,#eff6ff);}
        .ai-block.warning{border-left-color:var(--warning);background:linear-gradient(135deg,#fffbeb,#fef3c7);}
        .ai-block.success{border-left-color:var(--success);background:linear-gradient(135deg,#ecfdf5,#d1fae5);}
        .ai-block.danger{border-left-color:var(--danger);background:linear-gradient(135deg,#fef2f2,#fee2e2);}

        .checklist-item{border:1.5px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:8px;}
        .checklist-item.completed{border-color:var(--success);background:var(--success-light);}
        .checklist-header{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
        .checklist-num{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
        .checklist-num.done-num{background:var(--success);}
        .checklist-title{font-weight:700;font-size:12px;}
        .method-box{background:var(--primary-light);border-radius:var(--radius-sm);padding:6px 9px;font-size:10px;margin:3px 0;}
        .ref-box{background:var(--warning-light);border-radius:var(--radius-sm);padding:6px 9px;font-size:10px;margin:3px 0;}

        .summary-card{background:linear-gradient(135deg,#1e40af,#1d4ed8);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:10px;}
        .summary-score{font-size:36px;font-weight:800;line-height:1;}
        .summary-label{font-size:10px;opacity:0.8;}
        .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
        .summary-item{background:rgba(255,255,255,0.15);border-radius:var(--radius-sm);padding:7px;}
        .summary-item-label{font-size:9px;opacity:0.7;}.summary-item-value{font-size:14px;font-weight:700;margin-top:1px;}

        /* 聊天面板 */
        .chat-panel{border:1.5px solid var(--primary-soft);border-radius:var(--radius);overflow:hidden;margin-top:8px;}
        .chat-header-bar{background:var(--primary-light);padding:9px 12px;font-weight:700;font-size:12px;color:var(--primary);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
        .chat-header-bar .chat-arrow{transition:transform 0.25s;font-size:9px;}
        .chat-header-bar.expanded .chat-arrow{transform:rotate(90deg);}
        .chat-body{display:none;flex-direction:column;max-height:350px;}
        .chat-body.show{display:flex;}
        .chat-messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;max-height:200px;-webkit-overflow-scrolling:touch;}
        .chat-messages::-webkit-scrollbar{width:2px;}.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
        .chat-msg{max-width:88%;padding:8px 10px;border-radius:14px;font-size:11px;line-height:1.5;animation:slideUp 0.2s ease;}
        .chat-msg.user{align-self:flex-end;background:var(--chat-user-bg);border-bottom-right-radius:3px;}
        .chat-msg.ai{align-self:flex-start;background:var(--chat-ai-bg);border:1px solid var(--border-light);border-bottom-left-radius:3px;}
        .chat-input-row{display:flex;gap:5px;padding:7px 8px;border-top:1px solid var(--border-light);background:var(--surface);}
        .chat-input-row input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:16px;font-size:11px;font-family:inherit;outline:none;}
        .chat-input-row input:focus{border-color:var(--primary);}
        .chat-send-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
        .chat-typing{display:flex;gap:3px;padding:6px;}.chat-typing span{width:4px;height:4px;border-radius:50%;background:var(--text-muted);animation:bounce 1.2s infinite;}
        .chat-typing span:nth-child(2){animation-delay:0.15s;}.chat-typing span:nth-child(3){animation-delay:0.3s;}
        @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-4px);opacity:1;}}

        .history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
        .toast{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 18px;border-radius:18px;font-size:12px;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none;}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(3px);}
        .empty-state{text-align:center;padding:30px 16px;color:var(--text-muted);}.empty-icon{font-size:36px;margin-bottom:8px;}
        .spinner{width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}

        /* 查询面板 */
        .query-panel{position:fixed;top:0;right:-100%;width:100%;max-width:420px;height:100%;height:100dvh;background:var(--surface);z-index:150;transition:right 0.35s;box-shadow:-4px 0 30px rgba(0,0,0,0.15);display:flex;flex-direction:column;border-left:2px solid var(--border);}
        .query-panel.open{right:0;}
        .query-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(2px);z-index:149;opacity:0;pointer-events:none;transition:opacity 0.35s;}
        .query-overlay.active{opacity:1;pointer-events:auto;}
        .query-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;}
        .query-close-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
        .query-list{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch;}
        .query-item{background:var(--bg);border:1px solid var(--border-light);border-radius:14px;padding:12px;margin-bottom:10px;font-size:13px;}
        .query-item .meta{font-size:11px;color:var(--text-muted);margin-bottom:6px;display:flex;justify-content:space-between;}
        .query-del-btn{background:none;border:1px solid var(--border);color:var(--text-secondary);font-size:14px;cursor:pointer;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;}

        @media(max-width:380px){.header-title{font-size:14px;}.card{padding:10px;}.summary-score{font-size:28px;}.query-panel{max-width:100%;}}
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="query-overlay" id="queryOverlay"></div>
    <div class="query-panel" id="queryPanel">
        <div class="query-header">
            <span>📋 云端记录查询</span>
            <button class="query-close-btn" id="queryCloseBtn">✕</button>
        </div>
        <div style="display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border-light);">
            <button class="btn btn-ghost btn-xs" id="btnDeleteAllCloud">🗑 全部删除</button>
        </div>
        <div id="queryContent" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
    </div>

    <div class="header">
        <div class="header-title">📍 商铺选址分析</div>
        <div class="header-actions">
            <button class="btn btn-ghost btn-sm" id="btnHistory">📂 历史</button>
            <button class="btn btn-ghost btn-sm" id="btnCloud">🔍 云端</button>
            <button class="btn btn-ghost btn-sm" id="btnNew">🆕 新建</button>
        </div>
    </div>
    <div class="steps-bar" id="stepsBar">
        <div class="step-group"><div class="step-dot" id="stepDot1">1</div><div class="step-label" id="stepLabel1">输入</div></div>
        <div class="step-line" id="stepLine1"></div>
        <div class="step-group"><div class="step-dot" id="stepDot2">2</div><div class="step-label" id="stepLabel2">采集</div></div>
        <div class="step-line" id="stepLine2"></div>
        <div class="step-group"><div class="step-dot" id="stepDot3">3</div><div class="step-label" id="stepLabel3">初步报告</div></div>
        <div class="step-line" id="stepLine3"></div>
        <div class="step-group"><div class="step-dot" id="stepDot4">4</div><div class="step-label" id="stepLabel4">实地清单</div></div>
        <div class="step-line" id="stepLine4"></div>
        <div class="step-group"><div class="step-dot" id="stepDot5">5</div><div class="step-label" id="stepLabel5">最终报告</div></div>
    </div>
    <div class="main-content" id="mainContent"></div>

    <script>
    (function(){
        // ===== API 密钥 =====
        var _k1='sk-079eb73',_k2='ca6b944f6a3ee',_k3='479c2cacff51';
        var DS_KEY=_k1+_k2+_k3,DS_URL='https://api.deepseek.com/v1/chat/completions',DS_MODEL='deepseek-v4-flash';
        // ===== 新 GitHub Token =====
        var _g1='ghp_QLnOF036Q',_g2='ksNHotwH0EEgM',_g3='5ksIR0tH4JzWsb';
        var GH_TOKEN=_g1+_g2+_g3,GH_OWNER='SH1996',GH_REPO='CC',GH_FILE='chats.json';
        var GH_API='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_FILE;
        var QUERY_PASSWORD='jinxi2026';

        function getAmapKey(){return localStorage.getItem('amap_site_k_v9')||'';}
        function setAmapKey(k){localStorage.setItem('amap_site_k_v9',k);}

        var currentEval=createEmpty(),step4Chat=[],step5Chat=[],selectedRadius=3000,toastTimer=null,cloudSaving=false;

        function createEmpty(){return{id:'',address:'',industry:'',radius:3000,coordinates:null,rawData:{},aiAnalysis:{},fieldChecklist:[],fieldData:{},finalReport:null,chatHistory4:[],chatHistory5:[],status:'draft',createdAt:'',updatedAt:''};}

        var $m=document.getElementById('mainContent'),$t=document.getElementById('toast');
        var $qPanel=document.getElementById('queryPanel'),$qOverlay=document.getElementById('queryOverlay');

        document.getElementById('btnHistory').addEventListener('click',showHistory);
        document.getElementById('btnCloud').addEventListener('click',openQueryPanel);
        document.getElementById('btnNew').addEventListener('click',startNew);
        document.getElementById('queryCloseBtn').addEventListener('click',closeQueryPanel);
        $qOverlay.addEventListener('click',closeQueryPanel);
        document.getElementById('btnDeleteAllCloud').addEventListener('click',deleteAllCloudRecords);

        function toast(m){clearTimeout(toastTimer);$t.textContent=m;$t.classList.add('show');toastTimer=setTimeout(function(){$t.classList.remove('show');},2500);}
        function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
        function genId(){return 'e_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
        function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
        function fmtDist(m){if(!m&&m!==0)return'?';m=parseInt(m);return m<1000?m+'m':(m/1000).toFixed(1)+'km';}
        function distClass(m){if(!m&&m!==0)return'';if(parseInt(m)<=500)return'near';if(parseInt(m)<=1500)return'mid';return'far';}

        function updateSteps(s){for(var i=1;i<=5;i++){var d=document.getElementById('stepDot'+i),l=document.getElementById('stepLabel'+i),ln=document.getElementById('stepLine'+i);if(!d)continue;d.classList.remove('active','done');if(l)l.classList.remove('active');if(ln)ln.classList.remove('done');if(i<s){d.classList.add('done');if(ln)ln.classList.add('done');}else if(i===s){d.classList.add('active');if(l)l.classList.add('active');}}}

        async function callDS(msgs, temp, mt) {
    temp = temp || 0.7;
    mt = mt || 2000;
    // ===== 加这 3 行 =====
    var controller = new AbortController();
    var timeout = setTimeout(function() { controller.abort(); }, 90000);  // 90秒超时
    try {
        var r = await fetch(DS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DS_KEY },
            body: JSON.stringify({ model: DS_MODEL, messages: msgs, temperature: temp, max_tokens: mt, stream: false }),
            signal: controller.signal  // ===== 加这个参数 =====
        });
        clearTimeout(timeout);  // ===== 加这行 =====
        if (!r.ok) { var e = await r.text(); throw new Error('API ' + r.status + ': ' + e.slice(0, 100)); }
        var d = await r.json();
        return d.choices[0].message.content;
    } catch (e) {
        clearTimeout(timeout);  // ===== 加这行 =====
        if (e.name === 'AbortError') throw new Error('请求超时，数据量较大请稍后重试');
        throw e;
    }
}

        async function amapGeocode(addr){var k=getAmapKey();if(!k)throw new Error('NO_KEY');var u='https://restapi.amap.com/v3/geocode/geo?key='+k+'&address='+encodeURIComponent(addr);var r=await fetch(u);var d=await r.json();if(d.status==='1'&&d.geocodes&&d.geocodes.length>0){var l=d.geocodes[0].location.split(',');return{lng:parseFloat(l[0]),lat:parseFloat(l[1]),fmt:d.geocodes[0].formatted_address||addr};}throw new Error('地址解析失败');}

        async function amapPOISearch(loc,kw,rad){rad=rad||3000;var k=getAmapKey();if(!k)throw new Error('NO_KEY');var all=[];for(var p=1;p<=3;p++){var u='https://restapi.amap.com/v3/place/around?key='+k+'&location='+loc+'&keywords='+encodeURIComponent(kw)+'&radius='+rad+'&offset=25&page='+p;var r=await fetch(u);var d=await r.json();if(d.status==='1'&&d.pois&&d.pois.length>0){all=all.concat(d.pois);if(d.pois.length<25)break;}else break;await sleep(150);}return all;}

        async function searchSchools(loc,rad){var all=[],seen={};var kw=['学校','大学','学院','中学','小学','幼儿园','职业学校','技术学院','培训学校','教育'];for(var i=0;i<kw.length;i++){try{var r=await amapPOISearch(loc,kw[i],rad);for(var j=0;j<r.length;j++){var k=r[j].name+'|'+(r[j].address||'');if(!seen[k]){seen[k]=true;all.push(r[j]);}}}catch(e){}await sleep(100);}all.sort(function(a,b){return(parseInt(a.distance)||99999)-(parseInt(b.distance)||99999);});return all;}

        function getLocalEvals(){try{return JSON.parse(localStorage.getItem('site_evals_v9')||'[]');}catch(e){return[];}}
        function saveLocalEvals(evals){if(evals.length>100)evals=evals.slice(-100);localStorage.setItem('site_evals_v9',JSON.stringify(evals));}

            h+='<div class="card"><div class="card-title"><span class="layer-badge badge-layer2">二</span>有效客户</div><div class="ai-block">'+esc(a.layer2_analysis||'')+'</div></div>';
            h+='<div class="card"><div class="card-title"><span class="layer-badge badge-layer3">三</span>地形垄断</div><div class="ai-block">'+esc(a.layer3_analysis||'')+'</div></div>';
            h+='<div class="card"><div class="card-title"><span class="layer-badge badge-layer4">四</span>竞争对手</div><div class="ai-block">'+esc(a.layer4_analysis||'')+'</div></div>';
            h+='<div class="card"><div class="card-title">⚠️风险 & 💡机会</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><div style="background:var(--danger-light);padding:8px;border-radius:6px;"><strong>⚠️风险</strong>';var rs=a.risks||[];for(var ri=0;ri<rs.length;ri++)h+='<div style="font-size:10px;">• '+esc(rs[ri])+'</div>';h+='</div><div style="background:var(--success-light);padding:8px;border-radius:6px;"><strong>💡机会</strong>';var ops=a.opportunities||[];for(var oi=0;oi<ops.length;oi++)h+='<div style="font-size:10px;">• '+esc(ops[oi])+'</div>';h+='</div></div></div>';
            h+='<div class="card"><div class="card-title">📊 高德搜索原始数据</div><div style="font-size:10px;color:var(--text-muted);">⬇ 点击展开查看每家店的名称和距离</div>'+tables+'</div>';
            h+='<div class="card"><div class="card-title">💬 AI 问答 <span style="font-size:10px;color:var(--text-muted);">（基于初步报告·半结论）</span></div>'+renderChatPanel('chat4','step4')+'</div>';
            h+='<div class="card"><div class="card-title">📋 实地考察清单</div>';var cl=currentEval.fieldChecklist||[];for(var ci=0;ci<cl.length;ci++)h+=buildCheckItem(cl[ci],ci);h+='</div>';
            h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:40px;"><button class="btn btn-primary" id="bs" style="flex:1;justify-content:center;">✅ 提交实地数据</button><button class="btn btn-outline btn-sm" id="bsv">💾 本地暂存</button><button class="btn btn-ghost btn-sm" id="bnw">🆕 新建</button></div>';
            render(h);
            document.getElementById('bs').addEventListener('click',submitField);
            document.getElementById('bsv').addEventListener('click',function(){saveCurrent();toast('💾 已保存到本地');});
            document.getElementById('bnw').addEventListener('click',startNew);
            if(step4Chat.length>0){var cb4=document.getElementById('chat4');if(cb4)cb4.classList.add('show');}
            saveCurrentToCloud(); // ✅ 自动存储到云端
        }

        function buildCheckItem(item,idx){var fd=currentEval.fieldData||{};var sv=fd[item.id]||'';var done=sv!==''&&sv!==null;var inp='';switch(item.inputType){case'number':inp='<input type="number" class="form-input" id="f_'+item.id+'" value="'+esc(String(sv))+'" style="max-width:160px;"> '+(item.unit?esc(item.unit):'');break;case'select':var ops=item.inputOptions||[];inp='<select class="form-select" id="f_'+item.id+'" style="max-width:200px;"><option value="">请选</option>';for(var o=0;o<ops.length;o++)inp+='<option value="'+esc(ops[o])+'"'+(sv===ops[o]?' selected':'')+'>'+esc(ops[o])+'</option>';inp+='</select>';break;case'text':inp='<textarea class="form-textarea" id="f_'+item.id+'" rows="2">'+esc(String(sv))+'</textarea>';break;default:inp='<input type="text" class="form-input" id="f_'+item.id+'" value="'+esc(String(sv))+'">';}var h='<div class="checklist-item'+(done?' completed':'')+'"><div class="checklist-header"><div class="checklist-num'+(done?' done-num':'')+'">'+(idx+1)+'</div><div class="checklist-title">'+esc(item.title)+'</div><span style="font-size:9px;">'+(done?'✅':'⏳')+'</span></div>';if(item.aiEstimate)h+='<div style="font-size:10px;margin-bottom:3px;">🤖 '+esc(item.aiEstimate)+'</div>';if(item.method)h+='<div class="method-box">💡 '+esc(item.method)+'</div>';if(item.reference)h+='<div class="ref-box">📌 '+esc(item.reference)+'</div>';h+='<div style="margin-top:4px;"><label style="font-size:10px;font-weight:600;">✍️ 实测：</label>'+inp+'</div></div>';return h;}

        // ===== Step 5 =====
        async function submitField(){var fd={};var cl=currentEval.fieldChecklist||[];for(var i=0;i<cl.length;i++){var el=document.getElementById('f_'+cl[i].id);if(el&&el.value.trim())fd[cl[i].id]=el.value.trim();}currentEval.fieldData=fd;if(Object.keys(fd).length===0){toast('请至少填一项');return;}updateSteps(5);render('<div class="card"><div class="card-title">🧠 生成最终报告...</div><div style="display:flex;align-items:center;gap:6px;padding:14px;color:var(--text-secondary);"><div class="spinner"></div><span>AI分析中...</span></div></div>');try{var p='初步分析：'+JSON.stringify(currentEval.aiAnalysis)+'\n实地数据：'+JSON.stringify(fd)+'\n对照：'+JSON.stringify(cl.map(function(c){return{项目:c.title,AI预估:c.aiEstimate,实测:fd[c.id]||'未填'};}))+'\n输出JSON。';var r=await callDS([{role:'system',content:'只输出JSON。'},{role:'user',content:p}],0.4,3000);var m=r.match(/\{[\s\S]*\}/);if(!m)throw new Error('JSON解析失败');currentEval.finalReport=JSON.parse(m[0]);currentEval.status='final';step5Chat=currentEval.chatHistory5||[];saveCurrent();renderStep5();}catch(e){render('<div class="card"><div class="card-title">❌ 失败</div><p>'+esc(e.message)+'</p><button class="btn btn-primary" id="rf">🔄 重试</button></div>');document.getElementById('rf').addEventListener('click',submitField);}}

        function renderStep5(){updateSteps(5);var fr=currentEval.finalReport||{};var fd=currentEval.fieldData||{};var cl=currentEval.fieldChecklist||[];step5Chat=currentEval.chatHistory5||[];var vc='var(--success)',vi='✅';if(fr.verdict==='谨慎'){vc='var(--warning)';vi='⚠️';}if(fr.verdict==='建议放弃'){vc='var(--danger)';vi='❌';}var h='<div class="summary-card" style="text-align:center;"><div class="summary-label">📋 最终结论（半径'+currentEval.radius+'m）</div><div class="summary-score">'+(fr.finalScore||'--')+' 分</div><div style="font-size:16px;font-weight:700;color:'+vc+';margin-top:4px;">'+vi+' '+esc(fr.verdict||'--')+'</div><div style="font-size:12px;margin-top:4px;opacity:0.9;">'+esc(fr.finalSummary||'')+'</div></div>';
        h+='<div class="card"><div class="card-title">🔍 关键发现</div>';var kf=fr.keyFindings||[];for(var ki=0;ki<kf.length;ki++)h+='<div style="padding:4px 0;border-bottom:1px solid var(--border-light);font-size:12px;">• '+esc(kf[ki])+'</div>';h+='</div>';
        h+='<div class="card"><div class="card-title">📊 AI预估 vs 实测</div><div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;">'+esc(fr.comparisonToEstimate||'')+'</div>';for(var ci=0;ci<cl.length;ci++){var item=cl[ci],ai=item.aiEstimate||'-',ac=fd[item.id]||'未填';h+='<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:10px;border-bottom:1px dotted var(--border-light);"><span style="flex:1;">'+esc(item.title)+'</span><span style="width:65px;text-align:center;color:var(--primary);">AI:'+esc(String(ai))+'</span><span style="width:65px;text-align:center;font-weight:600;">实测:'+esc(String(ac))+'</span></div>';}h+='</div>';
        if(fr.adjustedAnalysis){h+='<div class="card"><div class="card-title">🔄 修正后四层分析</div>';h+='<div class="ai-block">'+esc(fr.adjustedAnalysis.layer1||'')+'</div>';h+='<div class="ai-block success">'+esc(fr.adjustedAnalysis.layer2||'')+'</div>';h+='<div class="ai-block warning">'+esc(fr.adjustedAnalysis.layer3||'')+'</div>';h+='<div class="ai-block danger">'+esc(fr.adjustedAnalysis.layer4||'')+'</div></div>';}
        if(fr.actionItems&&fr.actionItems.length>0){h+='<div class="card"><div class="card-title">📝 后续待办</div>';for(var ai=0;ai<fr.actionItems.length;ai++)h+='<div style="display:flex;align-items:center;gap:4px;padding:3px 0;font-size:11px;"><input type="checkbox"> '+esc(fr.actionItems[ai])+'</div>';h+='</div>';}
        h+='<div class="card"><div class="card-title">💬 AI 问答 <span style="font-size:10px;color:var(--text-muted);">（基于初报+终报·全结论）</span></div>'+renderChatPanel('chat5','step5')+'</div>';
        h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:40px;"><button class="btn btn-outline" id="bb" style="flex:1;justify-content:center;">🔙 返回修改</button><button class="btn btn-outline btn-sm" id="bsv2">💾 本地暂存</button><button class="btn btn-ghost btn-sm" id="bn2">🆕 新建</button></div>';
        render(h);
        document.getElementById('bb').addEventListener('click',function(){renderStep4();});
        document.getElementById('bsv2').addEventListener('click',function(){saveCurrent();toast('💾 已保存到本地');});
        document.getElementById('bn2').addEventListener('click',startNew);
        if(step5Chat.length>0){var cb5=document.getElementById('chat5');if(cb5)cb5.classList.add('show');}
        toast('✅ 最终报告已生成');
        saveCurrentToCloud(); // ✅ 自动存储到云端
        }

        // ===== 历史 =====
        function showHistory(){updateSteps(0);var evals=getLocalEvals();if(!evals.length){render('<div class="empty-state"><div class="empty-icon">📂</div><div>暂无本地记录</div><button class="btn btn-primary" id="be" style="margin-top:10px;">🆕 新建</button></div>');document.getElementById('be').addEventListener('click',startNew);return;}var h='<div class="card"><div class="card-title" style="justify-content:space-between;"><span>📂 本地历史 ('+evals.length+')</span><button class="btn btn-ghost btn-xs" id="bc">🗑 清空</button></div></div>';var rev=evals.slice().reverse();for(var i=0;i<rev.length;i++){var e=rev[i],sc='--';if(e.finalReport)sc=e.finalReport.finalScore||'--';var st=e.status==='final'?'✅':'⏳';h+='<div class="history-item" data-id="'+esc(e.id)+'"><div><div style="font-weight:600;">📍 '+esc(e.address||'')+'</div><div style="font-size:10px;color:var(--text-secondary);">🏪 '+esc(e.industry||'')+' · '+st+' · '+esc(e.radius||'?')+'m</div></div><div style="text-align:right;"><div style="font-weight:700;">'+sc+'</div><button class="btn btn-ghost btn-xs bd" data-id="'+esc(e.id)+'">🗑</button></div></div>';}h+='<div style="height:40px;"></div>';render(h);document.getElementById('bc').addEventListener('click',function(){if(!confirm('清空？'))return;localStorage.removeItem('site_evals_v9');toast('已清空');showHistory();});var its=document.querySelectorAll('.history-item');for(var j=0;j<its.length;j++)its[j].addEventListener('click',function(){loadEval(this.getAttribute('data-id'));});var ds=document.querySelectorAll('.bd');for(var k=0;k<ds.length;k++)ds[k].addEventListener('click',function(e){e.stopPropagation();deleteEval(this.getAttribute('data-id'));});}
        function loadEval(id){var evals=getLocalEvals();var f=null;for(var i=0;i<evals.length;i++){if(evals[i].id===id){f=evals[i];break;}}if(!f){toast('未找到');return;}currentEval=JSON.parse(JSON.stringify(f));step4Chat=currentEval.chatHistory4||[];step5Chat=currentEval.chatHistory5||[];if(currentEval.status==='final')renderStep5();else if(currentEval.status==='ai_analyzed')renderStep4();else if(currentEval.status==='data_collected'){updateSteps(3);runAI();}else renderStep1();toast('已加载');}
        function deleteEval(id){if(!confirm('删除？'))return;var evals=getLocalEvals();var n=[];for(var i=0;i<evals.length;i++){if(evals[i].id!==id)n.push(evals[i]);}saveLocalEvals(n);toast('已删除');showHistory();}
        function startNew(){currentEval=createEmpty();step4Chat=[];step5Chat=[];renderStep1();}

        function init(){currentEval=createEmpty();renderStep1();console.log('📍 V9.0 | 新Token | 第5步AI结合初报+终报回答');}
        init();
    })();
    </script>
</body>
</html>
