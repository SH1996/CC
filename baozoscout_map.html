<!DOCTYPE html>

<style>
/* ═══════════════════════════════════════════
   Design System
   ═══════════════════════════════════════════ */
:root{
  --bg:#0f172a; --surface:#1e293b; --border:#334155;
  --muted:#64748b; --text:#e2e8f0; --dim:#94a3b8;
  --accent:#3b82f6; --accent2:#8b5cf6;
  --radius:12px; --transition:.25s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); height:100vh; height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}

/* ═══ TOP BAR ═══ */
#topbar{
  flex-shrink:0; background:rgba(15,23,42,.95); backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:10px 14px; display:flex; align-items:center; gap:10px;
  z-index:10; border-bottom:1px solid rgba(255,255,255,.06);
}
#topbar .hamburger{
  width:32px; height:32px; display:flex; flex-direction:column;
  justify-content:center; gap:4px; padding:6px; border-radius:8px;
  cursor:pointer; flex-shrink:0; transition:background .15s;
}
#topbar .hamburger:active{background:var(--border);}
#topbar .hamburger span{
  display:block; height:2px; background:var(--text); border-radius:1px;
  transition:all .2s;
}
#topbar .hamburger.open span:nth-child(1){transform:rotate(45deg) translate(1px,-3px);}
#topbar .hamburger.open span:nth-child(2){opacity:.5;width:12px;}
#topbar .hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(-1px,3px);}
#topbar .title{font-size:15px;font-weight:700;color:var(--text);flex:1;display:flex;align-items:center;gap:6px;}
#topbar .title .badge{
  font-size:10px; background:var(--accent2); color:#fff; padding:2px 7px;
  border-radius:8px; font-weight:500;
}
#topbar .loc-label{
  font-size:11px; color:var(--dim); max-width:120px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; text-align:right;
}

/* ═══ SIDEBAR ═══ */
#sidebar{
  position:fixed; top:0; left:0; width:290px; max-width:85vw;
  height:100vh; height:100dvh; background:var(--surface);
  color:var(--text); display:flex; flex-direction:column;
  z-index:20; transform:translateX(-100%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 40px rgba(0,0,0,.5);
}
#sidebar.open{transform:translateX(0);}
#sidebar h3{
  padding:16px; font-size:16px; background:linear-gradient(135deg,#1d4ed8,var(--accent2));
  color:#fff; flex-shrink:0; display:flex; align-items:center; gap:8px;
}
#sidebar h3 .close{
  position:absolute; right:12px; width:28px; height:28px;
  border-radius:50%; background:rgba(255,255,255,.15); border:none;
  color:#fff; font-size:16px; cursor:pointer; display:flex;
  align-items:center; justify-content:center; line-height:1;
}
#sidebar h3 .close:active{background:rgba(255,255,255,.3);}
#districtList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0;}
.district{border-bottom:1px solid rgba(255,255,255,.05);}
.district .dh{
  padding:14px 18px; cursor:pointer; display:flex; align-items:center; gap:10px;
  font-size:14px; font-weight:600; transition:background .12s;
}
.district .dh:active{background:var(--border);}
.district .dh .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.district .dh .arrow{
  font-size:10px; margin-left:auto; color:var(--muted);
  transition:transform .2s;
}
.district.open .dh .arrow{transform:rotate(90deg);}
.district .dh .count{font-size:11px;color:var(--dim);font-weight:400;}
.subs{display:none;padding:0 0 8px;}
.district.open .subs{display:block;}
.subs .si{
  padding:11px 18px 11px 38px; cursor:pointer; font-size:13px;
  color:var(--dim); border-left:3px solid transparent;
  transition:all .12s; display:flex; align-items:center; gap:6px;
}
.subs .si:active{background:var(--border);color:var(--text);}
.subs .si.active{background:rgba(59,130,246,.2);color:#fff;border-left-color:var(--accent);}
.subs .si .fire{font-size:14px;}
.si-group{font-size:10px;color:var(--muted);padding:8px 18px 2px 26px;text-transform:uppercase;letter-spacing:.5px;}
.si-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;flex-shrink:0;margin-right:4px;}
.si-r{font-size:9px;color:var(--muted);margin-left:auto;}

/* ═══ OVERLAY ═══ */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;}
#overlay.open{display:block;}

/* ═══ MAP ═══ */
#mapContainer{flex:1;position:relative;min-height:0;}
#ibmap{width:100%;height:100%;}

/* floating pill */
#infoPill{
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  background:rgba(15,23,42,.92); backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text); padding:6px 14px; border-radius:20px;
  font-size:11px; z-index:4; display:none; align-items:center; gap:6px;
  white-space:nowrap; border:1px solid rgba(255,255,255,.1);
}
#infoPill .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* search radius ring hint */
#radiusRing{
  position:absolute; bottom:8px; right:10px; z-index:3;
  display:none; align-items:center; gap:4px;
  background:rgba(15,23,42,.8); padding:4px 10px; border-radius:10px;
  font-size:10px; color:var(--dim);
}

/* ═══ BOTTOM SHEET ═══ */
#sheet{
  flex-shrink:0; background:var(--surface); z-index:5;
  max-height:44vh; display:flex; flex-direction:column;
  border-top:1px solid rgba(255,255,255,.08);
  transition:max-height .35s cubic-bezier(.4,0,.2,1);
}
#sheet.collapsed{max-height:52px;overflow:hidden;}
#sheet .handle-area{
  flex-shrink:0; padding:8px 0 4px; display:flex; justify-content:center;
  cursor:pointer;
}
#sheet .handle{
  width:36px; height:4px; background:var(--muted); border-radius:2px;
}
/* category row */
#catRow{
  flex-shrink:0; display:flex; gap:6px; padding:4px 10px 8px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
#catRow::-webkit-scrollbar{display:none;}
.cat-chip{
  flex-shrink:0; padding:6px 12px; border-radius:16px;
  font-size:11px; font-weight:600; border:1.5px solid;
  cursor:pointer; white-space:nowrap; background:transparent;
  transition:all .15s; opacity:.35; display:flex; align-items:center; gap:4px;
}
.cat-chip.on{opacity:1;color:#fff;}
.cat-chip .n{
  font-size:9px; opacity:.65; font-weight:400;
  background:rgba(255,255,255,.1); padding:1px 6px; border-radius:8px;
}
/* search row */
#searchRow{
  flex-shrink:0; display:flex; gap:8px; padding:6px 10px 10px; align-items:center;
}
#searchRow input{
  flex:1; padding:8px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:13px; outline:none;
  min-width:0;
}
#searchRow input:focus{border-color:var(--accent);}
#searchRow input::placeholder{color:var(--muted);}
#searchRow .go-btn{
  padding:8px 16px; border-radius:10px; border:none; background:var(--accent);
  color:#fff; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0;
  transition:all .12s;
}
#searchRow .go-btn:active{background:#2563eb;transform:scale(.96);}
#searchRow .go-btn.loading{opacity:.5;pointer-events:none;}
#resultMeta{
  flex-shrink:0; padding:0 10px 6px; font-size:11px; color:var(--dim);
  display:flex; align-items:center; gap:6px;
}
#resultMeta .sep{color:var(--muted);}
/* results list */
#resultList{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:0 6px 6px;
}
#resultList::-webkit-scrollbar{width:3px;}
#resultList::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.poi-card{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border-radius:10px; cursor:pointer; transition:all .12s; margin-bottom:2px;
  border:1px solid transparent;
}
.poi-card:active{background:rgba(59,130,246,.15);}
.poi-card.hl{
  background:rgba(59,130,246,.2); border-color:var(--accent);
}
.poi-card .icon-dot{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; background:rgba(255,255,255,.06);
}
.poi-card .info{flex:1;min-width:0;}
.poi-card .info .nm{
  font-size:13px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.poi-card .info .ad{
  font-size:11px; color:var(--dim); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.poi-card .meta{text-align:right;flex-shrink:0;}
.poi-card .meta .dst{font-size:11px;color:var(--dim);}
.poi-card .meta .cat-tag{
  font-size:9px; padding:1px 5px; border-radius:4px; margin-top:2px;
}
.empty-state{
  text-align:center; padding:32px 16px; color:var(--muted);
}
.empty-state .icon{font-size:36px; margin-bottom:8px;opacity:.5;}
.empty-state .msg{font-size:12px;}

/* ═══ TOAST ═══ */
.toast{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:var(--accent); color:#fff; padding:10px 22px;
  border-radius:22px; font-size:13px; z-index:99; opacity:0;
  transition:opacity .3s; pointer-events:none;
}

/* ═══ DESKTOP ═══ */
@media(min-width:769px){
  body{flex-direction:row;}
  #topbar{display:none;}
  #sidebar{
    position:relative; transform:none; box-shadow:none;
    width:300px; height:100vh; height:100dvh; max-width:none;
    flex-shrink:0;
  }
  #sidebar h3 .close{display:none;}
  #sheet{position:fixed;bottom:0;left:300px;right:0;max-height:42vh;}
  #mapContainer{flex:1;}
  .district .dh:hover{background:var(--border);}
  .subs .si:hover{background:var(--border);color:var(--text);}
}
@media(max-width:400px){
  .cat-chip{padding:4px 9px;font-size:10px;}
  #searchRow input{font-size:11px;padding:7px 10px;}
  .poi-card{padding:8px 10px;}
  .poi-card .icon-dot{width:28px;height:28px;font-size:14px;}
}
</style>
</head>

/* ═══════════════════════════════════════════
   State
   ═══════════════════════════════════════════ */
var map, sc=[113.36,23.13], sr=3000, sub=null;
var active={}; CATS.forEach(function(c){active[c.id]=false;});
var allPoi=[], iw=null, fcircles=[];
var sheetOpen=true;

/* ═══════════════════════════════════════════
   Init
   ═══════════════════════════════════════════ */
function initMap(){
  map=new AMap.Map('ibmap',{
    center:[113.36,23.13], zoom:11, zooms:[9,18],
    mapStyle:'amap://styles/normal', resizeEnable:true,
    touchZoom:true, dragEnable:true, zoomEnable:true
  });
  map.on('complete',function(){
    buildSidebar(); buildCatRow(); drawPlan();
  });
  map.on('click',function(e){
    sc=[e.lnglat.getLng(),e.lnglat.getLat()];
    dropPin(sc);
    document.getElementById('locLabel').textContent='📍 已设中心';
    setTimeout(function(){document.getElementById('locLabel').textContent='点击地图设中心';},2000);
  });
}

function dropPin(pos){
  var m=new AMap.Marker({
    position:pos, map:map,
    icon:new AMap.Icon({
      size:new AMap.Size(18,18),
      image:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><circle cx="9" cy="9" r="7" fill="#3b82f6" stroke="#fff" stroke-width="2.5"/><circle cx="9" cy="9" r="2" fill="#fff"/></svg>'),
      imageSize:new AMap.Size(18,18)
    }),
    offset:new AMap.Pixel(-9,-9)
  });
  setTimeout(function(){m.setMap(null);},1500);
}

/* ═══════════════════════════════════════════
   Sidebar
   ═══════════════════════════════════════════ */
function buildSidebar(){
  var h='', globalIdx=0;
  DISTS.forEach(function(d){
    h+='<div class="district" id="dist-'+d.id+'">';
    h+='<div class="dh" onclick="toggleDist(\''+d.id+'\')">';
    h+='<span class="dot" style="background:'+d.c+'"></span>'+d.n;
    h+='<span class="count">'+d.s.length+'个点位</span><span class="arrow">▶</span></div>';
    h+='<div class="subs" id="subs-'+d.id+'">';
    // 按半径分组
    var groups={};
    d.s.forEach(function(s){
      var r=s.r||3000;
      var label=(r<=2000)?'2km搜索圈':(r<=2500)?'2.5km搜索圈':'3km搜索圈';
      if(!groups[label]) groups[label]=[];
      groups[label].push(s);
    });
    Object.keys(groups).forEach(function(grp){
      h+='<div class="si-group">'+grp+'</div>';
      groups[grp].forEach(function(s){
        globalIdx++;
        h+='<div class="si" data-sid="'+s.id+'" onclick="pickSub(\''+d.id+'\',\''+s.id+'\')">';
        h+='<span class="si-num" style="background:'+d.c+'">'+globalIdx+'</span>';
        if(s.n.indexOf('🔥')>=0) h+='<span class="fire">🔥</span>';
        h+=s.n+'<span class="si-r">'+s.r+'m</span></div>';
      });
    });
    h+='</div></div>';
  });
  document.getElementById('districtList').innerHTML=h;
}

function toggleDist(id){
  var el=document.getElementById('dist-'+id);
  el.classList.toggle('open');
  var d=DISTS.find(function(x){return x.id===id;});
  if(d&&map) map.setZoomAndCenter(13,d.ct,false,600);
  closeSidebar();
}

function pickSub(distId,subId){
  document.querySelectorAll('.si').forEach(function(e){e.classList.remove('active');});
  var el=document.querySelector('.si[data-sid="'+subId+'"]');
  if(el) el.classList.add('active');
  var de=document.getElementById('dist-'+distId);
  if(de) de.classList.add('open');

  DISTS.forEach(function(d){d.s.forEach(function(s){if(s.id===subId) sub=s;});});
  if(!sub) return;

  sc=sub.ct; sr=sub.r||3000;
  map.setZoomAndCenter(14,sub.ct,false,600);

  // 高亮对应标记
  fcircles.forEach(function(m){
    if(m._sid===subId){
      m.setIcon(new AMap.Icon({
        size:new AMap.Size(26,26),
        image:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="11" fill="'+m._dc+'" stroke="#fff" stroke-width="2.5"/><text x="13" y="17" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">'+m._label+'</text></svg>'),
        imageSize:new AMap.Size(26,26)
      }));
      m.setzIndex(999);
    } else {
      m.setIcon(new AMap.Icon({
        size:new AMap.Size(20,20),
        image:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="8.5" fill="'+m._dc+'" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/><text x="10" y="14" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">'+m._label+'</text></svg>'),
        imageSize:new AMap.Size(20,20)
      }));
      m.setzIndex(100);
    }
  });

  document.getElementById('searchInput').value='包子';
  document.getElementById('locLabel').textContent='📍 '+sub.n;
  closeSidebar();
  openSheet();
  // 用户需手动勾选类别 + 点搜索
}

/* ═══════════════════════════════════════════
   Plan Markers — numbered points instead of circles
   ═══════════════════════════════════════════ */
function drawPlan(){
  fcircles=[];
  var idx=0;
  DISTS.forEach(function(d){
    d.s.forEach(function(s){
      idx++;
      var m=new AMap.Marker({
        position:s.ct, map:map,
        icon:new AMap.Icon({
          size:new AMap.Size(20,20),
          image:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="8.5" fill="'+d.c+'" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/><text x="10" y="14" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">'+idx+'</text></svg>'),
          imageSize:new AMap.Size(20,20)
        }),
        offset:new AMap.Pixel(-10,-10), zIndex:100,
        title:s.n+' ('+s.r+'m)'
      });
      m._sid=s.id; m._did=d.id; m._dc=d.c; m._label=idx+'';
      m.on('click',function(did,sid){
        return function(e){pickSub(did,sid);};
      }(d.id,s.id));
      fcircles.push(m);
    });
  });
}

/* ═══════════════════════════════════════════
   Categories
   ═══════════════════════════════════════════ */
function buildCatRow(){
  var h='';
  CATS.forEach(function(c){
    h+='<button class="cat-chip" id="chip-'+c.id+'" style="border-color:'+c.c+';color:'+c.c+'" onclick="toggleCat(\''+c.id+'\')">'+c.e+' '+c.n+'<span class="n">-</span></button>';
  });
  document.getElementById('catRow').innerHTML=h;
}

function toggleCat(id){
  active[id]=!active[id];
  var chip=document.getElementById('chip-'+id);
  if(chip) chip.className='cat-chip '+(active[id]?'on':'');
  allPoi.filter(function(p){return p.cat===id;}).forEach(function(p){
    p.m.setMap(active[id]?map:null);
  });
  renderList();
  updatePill();
}

/* ═══════════════════════════════════════════
   Search — REST API (same as index.html)
   ═══════════════════════════════════════════ */
function doSearch(){
  var kw=document.getElementById('searchInput').value.trim()||'包子';
  var btn=document.getElementById('searchBtn');
  btn.classList.add('loading');btn.textContent='⏳';

  // clear old
  allPoi.forEach(function(p){p.m.setMap(null);});
  allPoi=[];

  document.getElementById('resultList').innerHTML='<div class="empty-state"><div class="icon">🔍</div><div class="msg">正在搜索…</div></div>';
  document.getElementById('resultMeta').textContent='';
  document.getElementById('infoPill').style.display='none';

  var toSearch=CATS.filter(function(c){return active[c.id];});
  if(toSearch.length===0){
    btn.classList.remove('loading');btn.textContent='🔍 搜索';
    document.getElementById('resultList').innerHTML='<div class="empty-state"><div class="msg">请先开启上方类别</div></div>';
    return;
  }

  var done=0, total=toSearch.length, anyErr=null;

  toSearch.forEach(function(cat){
    fetchCat(cat,kw,function(err){
      done++;
      if(err) anyErr=err;
      if(done>=total){
        // 跨类别去重（按名称+坐标，容忍小数点浮动）
        var dedup={}, dupCnt=0;
        allPoi=allPoi.filter(function(p){
          var key=(p.name||'').replace(/\s+/g,'')+'|'+(p.lng||0).toFixed(4)+'|'+(p.lat||0).toFixed(4);
          if(dedup[key]){ p.m.setMap(null); dupCnt++; return false; }
          dedup[key]=true; return true;
        });
        btn.classList.remove('loading');btn.textContent='🔍 搜索';
        renderList(); updatePill(); updateChipCounts();
        if(anyErr&&allPoi.length===0){
          document.getElementById('resultList').innerHTML='<div class="empty-state"><div class="icon">⚠️</div><div class="msg">搜索出错，可能是网络或Key问题。换个片区试试？</div></div>';
        }
        // 去重提示
        if(dupCnt>0) document.getElementById('resultMeta').innerHTML+=' · <span style="color:#f59e0b;">已去重'+dupCnt+'个</span>';
      }
    });
  });
}

function fetchCat(cat,kw,cb){
  // 每类别并发拉5页，每页25条
  var all=[], seen={}, pending=5, hasErr=null;
  for(var p=1;p<=5;p++){
    (function(page){
      var u=REST_BASE+'/place/around?key='+REST_KEY
        +'&location='+sc[0]+','+sc[1]
        +'&radius='+sr
        +'&offset=25&page='+page
        +'&keywords='+encodeURIComponent(cat.kw||kw);
      fetch(u).then(function(r){return r.json();}).then(function(d){
        var data=d.data||d;
        if(data.status==='1'&&data.pois&&data.pois.length>0){
          data.pois.forEach(function(p){
            var id=p.id||p.name+'-'+p.location;
            if(seen[id]) return; seen[id]=true;
            var loc=p.location;
            if(typeof loc==='string'){
              var parts=loc.split(',');
              var lng=parseFloat(parts[0]), lat=parseFloat(parts[1]);
            } else {
              var lng=loc.lng||0, lat=loc.lat||0;
            }
            if(!lng||!lat) return;
            var dist=0;
            try{dist=Math.round(AMap.GeometryUtil.distance([lng,lat],sc));}catch(e){dist=0;}
            var m=new AMap.Marker({
              position:[lng,lat], map:active[cat.id]?map:null,
              icon:new AMap.Icon({
                size:new AMap.Size(10,10),
                image:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="'+cat.c+'" opacity="0.85"/></svg>'),
                imageSize:new AMap.Size(10,10)
              }),
              offset:new AMap.Pixel(-5,-5), zIndex:40,
              title:p.name||''
            });
            m.on('click',function(){
              map.setZoomAndCenter(16,[lng,lat],false,600);
              if(iw) iw.close();
              iw=new AMap.InfoWindow({
                content:'<div style="padding:8px 12px;font-size:12px;line-height:1.5;"><b>'+esc(p.name||'')+'</b><br><span style="color:#94a3b8;font-size:10px;">'+esc(p.address||'')+' · '+dist+'m</span></div>',
                offset:new AMap.Pixel(0,-16)
              });
              iw.open(map,[lng,lat]);
            });
            all.push({
              name:p.name||'', addr:p.address||'', dist:dist,
              cat:cat.id, c:cat.c, e:cat.e, m:m, lng:lng, lat:lat
            });
          });
          if(data.pois.length<25){ for(var i=page+1;i<=5;i++){pending--;} }
        } else { for(var i=page+1;i<=5;i++){pending--;} }
      }).catch(function(e){
        hasErr=e; pending--;
      }).finally(function(){
        pending--;
        if(pending<=0){ allPoi=allPoi.concat(all); cb(hasErr); }
      });
    })(p);
  }
}

/* ═══════════════════════════════════════════
   List
   ═══════════════════════════════════════════ */
function renderList(){
  var vis=allPoi.filter(function(p){return active[p.cat];});
  vis.sort(function(a,b){return a.dist-b.dist;});
  var meta='共 '+vis.length+' 个结果';
  var grps={};
  CATS.forEach(function(c){
    var n=vis.filter(function(p){return p.cat===c.id;}).length;
    if(n>0) grps[c.id]=n;
  });
  var parts=[];
  Object.keys(grps).forEach(function(id){
    var c=CATS.find(function(x){return x.id===id;});
    parts.push(c.e+' '+c.n+' <b>'+grps[id]+'</b>');
  });
  meta+='  ·  '+parts.join('  ');
  document.getElementById('resultMeta').innerHTML=meta;

  if(vis.length===0){
    document.getElementById('resultList').innerHTML='<div class="empty-state"><div class="icon">😕</div><div class="msg">这个区域没搜到，换个词试试</div></div>';
    return;
  }
  var h='';
  vis.forEach(function(p,i){
    h+='<div class="poi-card" data-pi="'+i+'" onclick="focusPoi('+i+')">';
    h+='<div class="icon-dot">'+p.e+'</div>';
    h+='<div class="info"><div class="nm">'+esc(p.name)+'</div><div class="ad">'+esc(p.addr)+'</div></div>';
    h+='<div class="meta"><div class="dst">'+p.dist+'m</div><div class="cat-tag" style="color:'+p.c+'">'+p.name+'</div></div>';
    h+='</div>';
  });
  document.getElementById('resultList').innerHTML=h;
}

function focusPoi(pi){
  var vis=allPoi.filter(function(p){return active[p.cat];});
  vis.sort(function(a,b){return a.dist-b.dist;});
  var p=vis[pi]; if(!p) return;

  document.querySelectorAll('.poi-card').forEach(function(e){e.classList.remove('hl');});
  var cards=document.querySelectorAll('.poi-card');
  if(cards[pi]){cards[pi].classList.add('hl');cards[pi].scrollIntoView({behavior:'smooth',block:'nearest'});}

  map.setZoomAndCenter(16,[p.lng,p.lat],false,600);

  if(iw) iw.close();
  iw=new AMap.InfoWindow({
    content:'<div style="padding:8px 12px;font-size:12px;line-height:1.5;"><b>'+esc(p.name)+'</b><br><span style="color:#94a3b8;font-size:10px;">'+esc(p.addr)+' · '+p.dist+'m</span></div>',
    offset:new AMap.Pixel(0,-16)
  });
  iw.open(map,[p.lng,p.lat]);
  p.m.setAnimation('AMAP_ANIMATION_DROP');
  setTimeout(function(){p.m.setAnimation(null);},700);
}

function highlight(idx){ focusPoi(idx); }

function updatePill(){
  var parts=[];
  CATS.forEach(function(c){
    var n=allPoi.filter(function(p){return p.cat===c.id&&active[c.id];}).length;
    if(n>0) parts.push('<span class="dot" style="background:'+c.c+'"></span>'+c.n+' '+n);
  });
  var el=document.getElementById('infoPill');
  if(parts.length>0){el.innerHTML=parts.join('&nbsp;&nbsp;');el.style.display='flex';}
  else el.style.display='none';
}

function updateChipCounts(){
  CATS.forEach(function(c){
    var n=allPoi.filter(function(p){return p.cat===c.id;}).length;
    var chip=document.getElementById('chip-'+c.id);
    if(chip){var span=chip.querySelector('.n');if(span) span.textContent=n||'-';}
  });
}

/* ═══════════════════════════════════════════
   Sheet
   ═══════════════════════════════════════════ */
function toggleSheet(){
  var sheet=document.getElementById('sheet');
  sheet.classList.toggle('collapsed');
  sheetOpen=!sheetOpen;
}
function openSheet(){
  var sheet=document.getElementById('sheet');
  sheet.classList.remove('collapsed');
  sheetOpen=true;
}

/* ═══════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════ */
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.style.opacity='1';
  setTimeout(function(){t.style.opacity='0';},1800);
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
  document.getElementById('hamburger').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('hamburger').classList.remove('open');
}

window.onload=initMap;
</script>
